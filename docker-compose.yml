# docker-compose.yml — Production
# Note: 'version' field removed (obsolete in Compose V2, causes warning)

services:

  # ── .NET 8 API ──────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: terminalpro-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - Finnhub__ApiKey=${FINNHUB_API_KEY:-}
      - Fmp__ApiKey=${FMP_API_KEY:-}
      - Anthropic__ApiKey=${ANTHROPIC_API_KEY:-}
      - ScraperService__Url=http://scraper:8001
    depends_on:
      scraper:
        condition: service_healthy
    networks:
      - terminalpro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── React Frontend (Nginx) ──────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: terminalpro-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - terminalpro

  # ── Python News Scraper ─────────────────────────────────────────────────────
  scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    container_name: terminalpro-scraper
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
    networks:
      - terminalpro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  terminalpro:
    driver: bridge
