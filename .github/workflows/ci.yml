name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # ── .NET API build + test ──────────────────────────────────────────────────
  api:
    name: .NET API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/TerminalPro.API/TerminalPro.API.csproj

      - name: Build
        run: dotnet build src/TerminalPro.API/TerminalPro.API.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish src/TerminalPro.API/TerminalPro.API.csproj -c Release -o publish --no-build

  # ── Frontend build ─────────────────────────────────────────────────────────
  frontend:
    name: React Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  # ── Docker build (on main only) ────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [api, frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f Dockerfile.api -t terminalpro-api:${{ github.sha }} .

      - name: Build Frontend image
        run: docker build -f Dockerfile.frontend -t terminalpro-frontend:${{ github.sha }} .

      - name: Build Scraper image
        run: docker build -f Dockerfile.scraper -t terminalpro-scraper:${{ github.sha }} .
