version: "3.9"

# Development overrides — mounts source for hot reload
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: build          # stop at SDK stage so we can use dotnet watch
    volumes:
      - ./src/TerminalPro.API:/app/src/TerminalPro.API
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    command: >
      dotnet watch run
      --project /app/src/TerminalPro.API/TerminalPro.API.csproj
      --urls http://+:5000

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_URL=http://localhost:5000

  scraper:
    volumes:
      - ./src/TerminalPro.Scraper:/app
    environment:
      - RELOAD=true
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
